<style>
/* Phone layouts keep money readable and leave room for a thumb-sized target. */
@media screen and (max-width:1100px){
 html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
 body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
 #app button,#app .record-tools a{min-height:44px;min-width:44px;overflow-wrap:anywhere}
 #app input:not([type=checkbox]):not([type=range]),#app select,#app textarea{font-size:16px;min-height:44px;min-width:0}
 #app input[type=checkbox]{width:20px;height:20px;min-height:20px;flex-shrink:0}
 #app .legend label,#app .scope-option,#app .comparison-months label{min-height:44px}
 .mobile-view{position:sticky;top:0;z-index:15;background:var(--paper);margin:14px -4px 18px;padding:10px 4px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
 .mobile-view select{width:100%;min-width:0}.mobile-view{scroll-margin-top:0}
 .main section,.main details{scroll-margin-top:85px}
 .main{padding-bottom:max(35px,env(safe-area-inset-bottom))}
 .plot-tools,.legacy-chart-tools{flex-wrap:wrap;gap:6px}.plot-tools button,.legacy-chart-tools button{font-size:13px;padding:8px 10px}
 .plot-legend{gap:5px 12px}.plot-legend button{font-size:13px;max-width:100%;text-align:left}
 .plot-detail,.goal-chart-detail,.chart-detail{font-size:13px;overflow-wrap:anywhere;line-height:1.65}
 .plot-hint,.plot-range,.plot-table,.legacy-chart-detail,.fineprint{font-size:12px;line-height:1.6}
 .plot-table summary,.analysis-disclosure>summary,.scope-panel>summary,.history-entry>summary{min-height:44px;padding-top:12px;padding-bottom:12px}
 .tablewrap{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
 .table-scroll-hint{display:none;margin:10px 0;font-size:12px;color:var(--muted)}.table-scroll-hint.visible{display:block}
 .comparison-table th:first-child,.comparison-table td:first-child{position:sticky;left:0;background:#f4f7f8;z-index:1;max-width:150px;overflow-wrap:anywhere}
 .report-chart.expanded,.legacy-chart-expanded{inset:0!important;border-radius:0!important;max-height:100dvh;overscroll-behavior:contain;padding:12px!important;padding-top:max(12px,env(safe-area-inset-top))!important;padding-bottom:max(12px,env(safe-area-inset-bottom))!important}
 .report-chart.expanded .plot-tools,.legacy-chart-expanded .legacy-chart-tools{position:sticky;top:0;z-index:2;background:white;padding:8px 0;border-bottom:1px solid var(--line)}
 .report-chart.expanded svg{height:clamp(220px,46dvh,440px)}
 .report-chart svg,#activity,svg.goal-trajectory,svg.goal-weeks{touch-action:pan-y pinch-zoom}
 .report-chart svg text{font-size:12px}.report-chart svg{height:280px}
 svg.goal-weeks text{font-size:14px}
 .report-controls .field,.comparison-tools .field{max-width:100%;min-width:0}
 .report-controls .field select,.comparison-tools .field select{max-width:100%;width:100%}
 .report-controls .report-scope{width:100%;max-width:none;font-size:12px}
 .report-rank>div:first-child{flex-wrap:wrap;row-gap:5px}.report-rank strong{white-space:normal}
 .comparison-table th:first-child{min-width:115px}.comparison-table td button{max-width:140px}
}
@media screen and (max-width:760px){
 .main{padding:18px 14px 36px}.top h1{font-size:1.65rem}.top p{font-size:14px}.top .actions{margin-top:12px}
 .view-panel:not([data-view=planner]){padding:18px!important}
 [data-view=monthly].panel,[data-view=accounts].panel{padding:0!important}
 .panel{padding:18px 14px}.report-card{padding:18px 12px}.report-card h2{font-size:17px}
 .report-card>p,.planner-intro p{font-size:13px}.report-metrics{gap:18px 12px}
 .report-metric span,.report-metric small{font-size:12px}.report-metric strong{font-size:19px}
 .funds-hero{padding:22px}.funds-hero strong{font-size:28px}.funds-hero p{font-size:13px}
 .toolbar{display:grid;grid-template-columns:44px 44px minmax(0,1fr);gap:8px}
 .toolbar .field{min-width:0}.toolbar .field:has(#from){grid-column:1/3;grid-row:2}.toolbar .field:has(#to){grid-column:3;grid-row:2}
 .toolbar #apply,.toolbar .ranges,.toolbar #range-back{grid-column:1/-1}.toolbar .ranges{display:grid;grid-template-columns:1fr 1fr;margin:0;gap:6px}
 .toolbar .ranges button{width:100%}.toolbar #apply{margin:0}
 .record-tools{display:flex;gap:7px}.record-tools a,.record-tools button{font-size:13px!important}
 #records tbody tr{grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:9px 10px;padding:18px 0}
 #records .record-name{grid-column:1/-1;grid-row:3;font-size:15px}
 #records .amount{grid-column:1/-1;grid-row:2;white-space:normal;text-align:left;font-size:21px;overflow-wrap:anywhere}
 #records .record-category{grid-row:4;font-size:13px}#records .record-date{font-size:13px}.record-tools{margin-top:10px}
 #records td:has(.record-actions){grid-row:5}.record-actions{flex-wrap:wrap}
 .report-flow,.report-flow tbody,.report-flow tfoot{display:block;width:100%}
 .report-flow thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
 .report-flow tbody tr,.report-flow tfoot tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;padding:18px 14px;border-bottom:1px solid var(--line)}
 .report-flow td:not(:first-child),.report-flow td{display:block;min-width:0;padding:0;border:0;text-align:left;white-space:normal;overflow-wrap:anywhere;font-size:14px;font-variant-numeric:tabular-nums}
 .report-flow td:first-child{grid-column:1/-1;font-weight:650;font-size:17px}.report-flow td:not(:first-child):before{content:attr(data-label);display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:400}
 .report-flow td:last-child{grid-column:1/-1;padding-top:12px;border-top:1px solid var(--line);font-size:20px;font-weight:600}.report-flow tfoot tr{background:#e8f2ee}
 .tablewrap:has(.report-flow){overflow:visible}.tablewrap:has(.report-flow)+.table-scroll-hint{display:none}
 .goal-choice{min-width:215px}.planner-stats{gap:12px}.planner-stat>span,.planner-stat>small{font-size:12px}
 .trajectory-panel,.scenario-panel{padding:18px 14px}.scenario-panel .field{max-width:none}.scenario-panel input{width:100%}
 .calendar-grid{gap:3px}.calendar-day{min-width:0;padding:5px 2px}.calendar-day small{font-size:10px}
 .history-entry summary,.receipt-row,.review-row{overflow-wrap:anywhere}.analysis-disclosure>summary small{display:block;margin:5px 0 0}
 .scope-picker select,.scope-picker input{width:100%}.scope-picker input[type=checkbox]{width:20px}
 .report-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.report-controls .report-scope{grid-column:1/-1}
}
@media screen and (max-width:360px){
 .main{padding-left:10px;padding-right:10px}.panel,.report-card{padding-left:10px;padding-right:10px}
 #app .report-controls,#app .comparison-tools{display:flex;flex-direction:column;align-items:stretch}.report-controls .field{width:100%}
 .pace-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pace-stats>div:last-child{grid-column:1/-1}
 .plot-legend{display:grid;grid-template-columns:1fr 1fr}.plot-legend button{line-height:1.4}
 .planner-stats{grid-template-columns:1fr}.planner-stat{padding-bottom:10px}
}
@media print{.table-scroll-hint{display:none!important}}
</style>
<script>
// One observer serves all dynamic charts/tables; removed panels release their callbacks.
const reportSizeWatchers=new Map();
const reportSizeObserver=new ResizeObserver(entries=>{for(const {target,contentRect}of entries)if(contentRect.width>0)reportSizeWatchers.get(target)?.(contentRect.width)});
function watchReportSize(node,callback){reportSizeWatchers.set(node,callback);reportSizeObserver.observe(node)}
document.addEventListener('DOMContentLoaded',()=>{
 const ready=new WeakSet();let pending=false;
 function enhance(){pending=false;
  for(const [node]of reportSizeWatchers)if(!node.isConnected){reportSizeObserver.unobserve(node);reportSizeWatchers.delete(node)}
  for(const wrap of document.querySelectorAll('.tablewrap'))if(!ready.has(wrap)){
   ready.add(wrap);if(wrap.closest('#records')||wrap.querySelector('.report-flow'))continue;
   wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label',(wrap.closest('section')?.querySelector('h2')?.textContent||'Chart data')+' table, scroll for more columns');
   const hint=element('p','Swipe sideways to see every column.','table-scroll-hint');wrap.after(hint);
   watchReportSize(wrap,()=>hint.classList.toggle('visible',wrap.scrollWidth>wrap.clientWidth+2));
  }
 }
 new MutationObserver(()=>{if(!pending){pending=true;queueMicrotask(enhance)}}).observe(document.getElementById('app'),{childList:true,subtree:true});enhance();
 document.getElementById('mobile-view').addEventListener('change',()=>document.querySelector('.top').scrollIntoView({block:'start'}));
 let width=innerWidth,timer;window.addEventListener('resize',()=>{if(innerWidth===width)return;width=innerWidth;clearTimeout(timer);timer=setTimeout(()=>{if(!printing&&data){chart();if(activeView==='planner'){const plan=data.status.plans.find(p=>p.goal.id===plannerGoal);if(plan)drawGoalTrajectory(plan,plannerModel(plan));}}},100)});
});
</script>
