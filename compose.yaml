name: fintrack

services:
  bot:
    build:
      context: .
      target: production
    image: fintrack:local
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:?Set ALLOWED_USER_IDS in .env}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      DEFAULT_TZ: ${DEFAULT_TZ:-Asia/Yerevan}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
      - backups:/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # The dashboard is bound to host loopback. Use the optional HTTPS proxy for remote access.

volumes:
  data:
  backups:
