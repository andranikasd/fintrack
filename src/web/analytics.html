   if(!bars){if(s.area&&hi>lo){const pairs=s.values.map((v,i)=>({v,i})).filter(p=>p.i>=lo&&p.i<=hi&&p.v!=null);if(pairs.length)svgNode(svg,'path',{d:path+'L'+x(pairs.at(-1).i)+','+bottom+' L'+x(pairs[0].i)+','+bottom+'Z',fill:color,opacity:.08});}svgNode(svg,'path',{d:path,fill:'none',stroke:color,'stroke-width':s.dash?2:2.7,'stroke-dasharray':s.dash||'',class:'plot-line'});for(let i=lo;i<=hi;i++)if(s.values[i]!=null)svgNode(svg,'circle',{cx:x(i),cy:y(s.values[i]),r:hi-lo>40?1.5:2.6,fill:color});}
  }

 }
 function zoom(factor){const width=Math.max(1,Math.min(labels.length-1,Math.round((hi-lo)*factor))),center=(lo+hi)/2;lo=Math.max(0,Math.round(center-width/2));hi=Math.min(labels.length-1,lo+width);lo=Math.max(0,hi-width);cursor=Math.max(lo,Math.min(hi,cursor));draw()}

function reportCard(parent,title,description,wide=false){const card=element('section',undefined,'report-card'+(wide?' wide':''));heading(card,title,description);parent.append(card);return card}
function reportRanking(parent,rows,color){if(!rows.length){parent.append(element('p','No recorded activity in this month.','empty'));return}const total=rows.reduce((s,r)=>s+r.amount,0);for(const r of rows){const row=element('div',undefined,'report-rank'),label=element('div');label.append(element('span',r.label),element('strong',money(r.amount)+' · '+(total?r.amount/total*100:0).toFixed(1)+'%'));const track=element('div',undefined,'track'),fill=element('div',undefined,'fill');fill.style.width=(total?r.amount/total*100:0)+'%';fill.style.background=color;track.append(fill);row.append(label,track);parent.append(row)}}
function reportPace(parent,m,budget){

  {name:'Previous month',values:m.daily.map(d=>d.previousSpent),color:'#7a8794',dash:'5 5'},
  ...(m.partial?[{name:'Estimate',values:m.daily.map((d,i)=>i+1<m.elapsed?null:Math.round(m.totals.expense/m.elapsed*(i+1))),color:'#bf7433',dash:'3 5'}]:[]),

 for(const [key,label]of [['cumulative','Cumulative'],['daily','Daily spending']]){const b=element('button',label);b.dataset.mode=key;b.onclick=()=>{mode=key;draw()};modes.append(b)}draw();

}

function renderAccountReport(parent,accountView=false){
 if(!data.accountHistory)return false;
 parent.replaceChildren();if(accountView)actionButton(parent,'Add account','account-create');

 const hero=element('div',undefined,'funds-hero'),funds=element('div'),now=element('div',undefined,'funds-now');funds.append(element('h2',m.partial?'Recorded account funds':'Month-end account funds'),element('strong',money(m.closing)),element('p','Opening '+money(m.opening)+' · Change '+money(m.closing-m.opening)+' during this month'));now.append(element('h2','Current account funds'),element('strong',money(data.accounts.filter(a=>(reportAccount===null||a.id===reportAccount)&&a.opening_on<=data.today).reduce((n,a)=>n+a.balance_minor,0))),element('p','As of '+data.today+'. Cash in accounts only; goal savings are held separately.'));hero.append(funds,now);parent.append(hero);
 const metrics=element('div',undefined,'report-metrics');
 for(const [label,value,previous,note]of [['Income received',m.totals.income,m.previous.income,'Active + passive income'],['Spending',m.totals.expense,m.previous.expense,'Purchases only'],['Net saved',m.totals.saving-m.totals.withdrawal,m.previous.saving-m.previous.withdrawal,'Deposits − withdrawals'],['Income left after spending',m.totals.income-m.totals.expense,m.previous.income-m.previous.expense,'Before savings transfers']]){const stat=element('div',undefined,'report-metric');stat.append(element('span',label),element('strong',money(value)),element('small',money(value-previous)+' vs previous period'),element('small',note));metrics.append(stat)}parent.append(metrics,element('p','Comparison: '+m.previousFrom+' to '+m.previousTo+'. '+(m.partial?'Matched elapsed calendar days.':'Full calendar months.'),'fineprint'));
 const grid=element('div',undefined,'report-grid');parent.append(grid);
 const fundsCard=reportCard(grid,'Account balances over time','Recorded funds at the end of each day or month. Select an account or hide a series to see smaller balances clearly.',true),balanceModes=element('div',undefined,'pace-mode'),balanceHost=element('div');fundsCard.append(balanceModes,balanceHost);
 function drawBalances(){balanceHost.replaceChildren();for(const b of balanceModes.children)b.setAttribute('aria-pressed',String(b.dataset.mode===reportBalanceMode));const points=reportBalanceMode==='daily'?m.daily.filter(d=>d.actual):m.months,series=m.rows.map((a,i)=>({name:a.name,values:points.map(d=>d.accounts.find(r=>r.id===a.id)?.balance??null),color:reportPalette[i%reportPalette.length]}));if(m.rows.length>1)series.unshift({name:'Total account funds',values:points.map(d=>reportBalanceMode==='daily'?d.balance:d.closing),color:'#173b4b'});financialChart(balanceHost,points.map(d=>d.day||d.period+(d.partial?' (partial)':'')),series,{title:reportBalanceMode==='daily'?'Daily account balances':'Monthly account balances'})}

// Preserve existing drill-downs while giving overview and goal charts the same exploration tools.
document.addEventListener('DOMContentLoaded',()=>{
 const ready=new WeakSet();let pending=false;
 function enhance(){
  pending=false;
  for(const svg of document.querySelectorAll('#activity,svg.share-chart,svg.goal-trajectory,svg.goal-weeks')){
   if(ready.has(svg))continue;ready.add(svg);
   const base=svg.viewBox.baseVal,original={x:base.x,y:base.y,width:base.width,height:base.height};if(!original.width)continue;
   const wrap=element('div',undefined,'legacy-chart-explorer'),toolbar=element('div',undefined,'legacy-chart-tools'),detail=element('div',undefined,'legacy-chart-detail');
   svg.before(wrap);wrap.append(toolbar,svg,detail);let scale=1,offset=original.x,drag=null,moved=false,expanded=false;
   const isDonut=svg.classList.contains('share-chart');
   const render=()=>svg.setAttribute('viewBox',[offset,original.y,original.width/scale,original.height].join(' '));
   const button=(label,fn)=>{const b=element('button',label);b.type='button';b.onclick=fn;toolbar.append(b);return b};
   function zoom(factor){const center=offset+original.width/scale/2;scale=Math.min(12,Math.max(1,scale*factor));offset=Math.max(original.x,Math.min(original.x+original.width-original.width/scale,center-original.width/scale/2));render()}
   if(!isDonut){button('+',()=>zoom(2)).setAttribute('aria-label','Zoom in');button('−',()=>zoom(.5)).setAttribute('aria-label','Zoom out');button('Reset',()=>{scale=1;offset=original.x;render()})}
   const expand=button('Expand',()=>{expanded=!expanded;wrap.classList.toggle('legacy-chart-expanded',expanded);expand.textContent=expanded?'Close':'Expand';expand.setAttribute('aria-expanded',String(expanded))});expand.setAttribute('aria-label','Expand chart');
   svg.setAttribute('tabindex','0');
   let cursor=0;
   const points=()=>[...svg.querySelectorAll('[tabindex][aria-label]')].filter(n=>n.style.display!=='none');
   function inspect(node){if(!node)return;detail.textContent=node.getAttribute('aria-label')||node.querySelector('title')?.textContent||'';if(node.onpointerenter)node.onpointerenter(new PointerEvent('pointerenter'));}
   svg.addEventListener('pointermove',e=>{const candidates=points();if(isDonut){const target=e.target.closest('[aria-label]');if(target!==svg)inspect(target);return}const bounds=svg.getBoundingClientRect(),ratio=(e.clientX-bounds.left)/bounds.width;
    if(drag!==null){const delta=(e.clientX-drag.clientX)/bounds.width*original.width/scale;if(Math.abs(e.clientX-drag.clientX)>6)moved=true;offset=Math.max(original.x,Math.min(original.x+original.width-original.width/scale,drag.offset-delta));render();return}
    const xpos=offset+ratio*original.width/scale;let nearest=null,distance=Infinity;for(const p of candidates){const box=p.getBBox(),d=Math.abs(box.x+box.width/2-xpos);if(d<distance){distance=d;nearest=p}}inspect(nearest);
   });
   svg.addEventListener('pointerdown',e=>{if(scale>1&&!isDonut&&e.button===0){moved=false;drag={clientX:e.clientX,offset};svg.setPointerCapture(e.pointerId)}});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
   svg.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopImmediatePropagation();moved=false}},{capture:true});
   svg.addEventListener('wheel',e=>{if(e.ctrlKey&&!isDonut){e.preventDefault();zoom(e.deltaY>0?.5:2)}},{passive:false});
   wrap.addEventListener('keydown',e=>{if(e.key==='Escape'){expanded=false;wrap.classList.remove('legacy-chart-expanded');expand.textContent='Expand';expand.setAttribute('aria-expanded','false');scale=1;offset=original.x;render()}if(e.target===svg&&['ArrowLeft','ArrowRight','Home','End','+','-'].includes(e.key)){e.preventDefault();const p=points();if(e.key==='+'||e.key==='-'){zoom(e.key==='+'?2:.5);return}cursor=e.key==='Home'?0:e.key==='End'?p.length-1:Math.max(0,Math.min(p.length-1,cursor+(e.key==='ArrowLeft'?-1:1)));inspect(p[cursor])}});
   if(svg.classList.contains('goal-trajectory')||svg.classList.contains('goal-weeks')){
    const legend=element('div',undefined,'plot-legend');
    const choices=svg.classList.contains('goal-weeks')?[['Deposits','#227a64'],['Withdrawals','#bd713b']]:[['Recorded','#227a64'],['Plan','#537895'],['Recent pace','#8b6c9c'],['Scenario','#bd713b']];
